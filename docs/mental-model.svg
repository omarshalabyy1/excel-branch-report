<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-label="The mental model: four branches each send 48 monthly files in their own messy template. West has title rows and a TOTAL row; East uses its own headers and dates typed as 02/03/2019; Central sends amounts as text like $1,234.50, capitals and double spaces; South writes Mar 05 2019, 3 pcs, Std and 2nd class. All 192 files pour into a funnel that cleans them to one standard and checks five rules plus duplicates. Out come one clean table of 9,836 rows, and a set-aside list of 253 rows, each with its reason: 96 lines pasted twice, 37 amounts not a number, 31 unreadable dates, 30 dates outside the file's month, 30 quantities not above zero, 29 missing order IDs. 10,089 rows read = 9,836 + 253.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10213A"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 15px; fill: #CBD5E1; }
    .name { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .count { font-size: 13px; fill: #60A5FA; }
    .desc { font-size: 14px; fill: #94A3B8; }
    .stage { font-size: 19px; font-weight: 700; fill: #FFFFFF; }
    .big { font-size: 28px; font-weight: 800; fill: #FFFFFF; }
    .card { fill: #FFFFFF; fill-opacity: 0.04; stroke: #475569; }
    .page { fill: #0B1220; stroke: #94A3B8; stroke-width: 1.5; }
    .pour { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect width="1000" height="490" rx="22" fill="url(#bg)"/>
  <text x="40" y="48" class="title">The mental model: many messy files in, one clean table out</text>
  <text x="40" y="74" class="sub">Every row read lands in exactly one place: the clean table, or the set-aside list with its reason.</text>

  <!-- four branches, each with its own template -->
  <g>
    <rect x="40" y="100" width="320" height="80" rx="12" class="card"/>
    <rect x="56" y="114" width="30" height="38" rx="4" class="page"/><rect x="64" y="122" width="30" height="38" rx="4" class="page"/>
    <text x="110" y="126" class="name">West</text><text x="160" y="126" class="count">48 files</text>
    <text x="110" y="148" class="desc">Title rows on top,</text>
    <text x="110" y="167" class="desc">a TOTAL row at the bottom</text>

    <rect x="40" y="192" width="320" height="80" rx="12" class="card"/>
    <rect x="56" y="206" width="30" height="38" rx="4" class="page"/><rect x="64" y="214" width="30" height="38" rx="4" class="page"/>
    <text x="110" y="218" class="name">East</text><text x="152" y="218" class="count">48 files</text>
    <text x="110" y="240" class="desc">Order No, Qty, Amount headers,</text>
    <text x="110" y="259" class="desc">dates typed as 02/03/2019</text>

    <rect x="40" y="284" width="320" height="80" rx="12" class="card"/>
    <rect x="56" y="298" width="30" height="38" rx="4" class="page"/><rect x="64" y="306" width="30" height="38" rx="4" class="page"/>
    <text x="110" y="310" class="name">Central</text><text x="176" y="310" class="count">48 files</text>
    <text x="110" y="332" class="desc">"$1,234.50" as text, CAPITALS,</text>
    <text x="110" y="351" class="desc">double spaces in names</text>

    <rect x="40" y="376" width="320" height="80" rx="12" class="card"/>
    <rect x="56" y="390" width="30" height="38" rx="4" class="page"/><rect x="64" y="398" width="30" height="38" rx="4" class="page"/>
    <text x="110" y="402" class="name">South</text><text x="160" y="402" class="count">48 files</text>
    <text x="110" y="424" class="desc">"Mar 05 2019", "3 pcs",</text>
    <text x="110" y="443" class="desc">"Std" and "2nd class"</text>
  </g>

  <!-- pouring into the funnel -->
  <path class="pour" d="M360 140H384"/>
  <path class="pour" d="M360 232H384"/>
  <path class="pour" d="M360 324H384"/>
  <path class="pour" d="M360 416H384"/>

  <!-- the funnel: clean, then check -->
  <path d="M384 100L644 238V322L384 456Z" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.8" stroke-width="2"/>
  <path d="M514 168V388" stroke="#3B82F6" stroke-opacity="0.5" stroke-dasharray="3 5"/>
  <text x="450" y="262" class="stage" text-anchor="middle">Clean</text>
  <text x="450" y="284" class="desc" text-anchor="middle">to one</text>
  <text x="450" y="302" class="desc" text-anchor="middle">standard</text>
  <text x="572" y="262" class="stage" text-anchor="middle">Check</text>
  <text x="572" y="284" class="desc" text-anchor="middle">5 rules +</text>
  <text x="572" y="302" class="desc" text-anchor="middle">duplicates</text>

  <!-- out: the clean table -->
  <path d="M644 262H682" stroke="#3B82F6" stroke-width="2.5" fill="none"/>
  <path d="M676 255l9 7-9 7" stroke="#3B82F6" stroke-width="2.5" fill="none"/>
  <rect x="690" y="100" width="270" height="200" rx="14" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6"/>
  <text x="712" y="134" class="name">One clean table</text>
  <text x="712" y="174" class="big">9,836 rows</text>
  <text x="712" y="200" class="desc">4 branches · 48 months · one format</text>
  <g stroke="#3B82F6" stroke-opacity="0.7" fill="none">
    <rect x="712" y="218" width="226" height="62" rx="4"/>
    <path d="M712 238.5h226M712 259h226M768.5 218v62M825 218v62M881.5 218v62"/>
  </g>

  <!-- out: the set-aside list -->
  <path d="M624 330 V380 Q624 392 636 392 H687" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#head)"/>
  <rect x="690" y="320" width="270" height="140" rx="14" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="712" y="350" class="name">Set aside, with the reason</text>
  <text x="712" y="384" class="big">253 rows</text>
  <text x="712" y="408" class="desc">96 lines pasted twice</text>
  <text x="712" y="427" class="desc">37 amount not a number · 31 bad date</text>
  <text x="712" y="446" class="desc">30 wrong month · 30 qty ≤ 0 · 29 no ID</text>

  <text x="40" y="478" class="desc">10,089 rows read = 9,836 clean + 253 set aside. The 48 West TOTAL rows are layout, skipped and counted apart.</text>
</svg>
