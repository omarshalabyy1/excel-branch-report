<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="How it works: 01 Collect, every branch's monthly Excel file in one folder; 02 Clean, names, dates, amounts and spellings to one standard; 03 Check, rows that break a rule set aside with the reason; 04 Merge, one clean table across all branches and months; 05 Report, weekly Excel and Power BI report rebuilt in one click.">
  <defs>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 15px; fill: #475569; }
    .num { font-size: 14px; font-weight: 700; fill: #0E1630; }
    .step { font-size: 18px; font-weight: 700; fill: #0E1630; }
    .desc { font-size: 14px; fill: #506078; }
    .cap { font-size: 13px; fill: #64748B; }
    .box { fill: #3B82F6; fill-opacity: 0.08; stroke: #3B82F6; stroke-opacity: 0.7; }
    .dot { fill: #3B82F6; fill-opacity: 0.35; }
    .link { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect x="1" y="1" width="998" height="298" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="50" class="title">How it works</text>
  <text x="40" y="76" class="sub">python run.py (or double-click run.bat), then Refresh in Power BI. Nothing is copied or pasted by hand.</text>

  <path class="link" d="M212 180h12"/>
  <path class="link" d="M400 180h12"/>
  <path class="link" d="M588 180h12"/>
  <path class="link" d="M776 180h12"/>

  <!-- 01 -->
  <rect x="40" y="105" width="172" height="150" rx="14" class="box"/>
  <circle cx="70" cy="138" r="16" class="dot"/><text x="70" y="143" class="num" text-anchor="middle">01</text>
  <text x="96" y="144" class="step">Collect</text>
  <text x="56" y="182" class="desc">Every branch's</text>
  <text x="56" y="202" class="desc">monthly Excel file</text>
  <text x="56" y="222" class="desc">in one folder</text>

  <!-- 02 -->
  <rect x="228" y="105" width="172" height="150" rx="14" class="box"/>
  <circle cx="258" cy="138" r="16" class="dot"/><text x="258" y="143" class="num" text-anchor="middle">02</text>
  <text x="284" y="144" class="step">Clean</text>
  <text x="244" y="182" class="desc">Headers, dates,</text>
  <text x="244" y="202" class="desc">amounts, spellings</text>
  <text x="244" y="222" class="desc">to one standard</text>

  <!-- 03 -->
  <rect x="416" y="105" width="172" height="150" rx="14" class="box"/>
  <circle cx="446" cy="138" r="16" class="dot"/><text x="446" y="143" class="num" text-anchor="middle">03</text>
  <text x="472" y="144" class="step">Check</text>
  <text x="432" y="182" class="desc">Five rules and</text>
  <text x="432" y="202" class="desc">duplicates: bad rows</text>
  <text x="432" y="222" class="desc">set aside, with why</text>

  <!-- 04 -->
  <rect x="604" y="105" width="172" height="150" rx="14" class="box"/>
  <circle cx="634" cy="138" r="16" class="dot"/><text x="634" y="143" class="num" text-anchor="middle">04</text>
  <text x="660" y="144" class="step">Merge</text>
  <text x="620" y="182" class="desc">One clean table:</text>
  <text x="620" y="202" class="desc">all branches,</text>
  <text x="620" y="222" class="desc">all months</text>

  <!-- 05 -->
  <rect x="792" y="105" width="172" height="150" rx="14" class="box"/>
  <circle cx="822" cy="138" r="16" class="dot"/><text x="822" y="143" class="num" text-anchor="middle">05</text>
  <text x="848" y="144" class="step">Report</text>
  <text x="808" y="182" class="desc">Weekly Excel and</text>
  <text x="808" y="202" class="desc">Power BI report,</text>
  <text x="808" y="222" class="desc">rebuilt in one click</text>

  <text x="500" y="282" class="cap" text-anchor="middle">Python · pandas · openpyxl · Power Query · Power BI</text>
</svg>
