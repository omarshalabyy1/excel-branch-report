<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="The Semantic layer is the Power BI model. Sales is the fact (9,836 rows, one per order line that passed every rule). Branch (4 rows) and Date (1,461 days) are the dimensions: Branch filters Sales on branch and Date filters Sales on order_date, one to many. Two data-quality tables sit beside the star: Set Aside (253 rows, the Gold layer's quarantine, key file plus excel_row) and Files (192 rows, the run log, one per branch workbook). Branch filters both on branch; neither has a date relationship.">
