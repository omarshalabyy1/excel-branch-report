<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 696" width="1000" height="696" role="img" aria-label="The Power BI model: five tables. Sales (9,836 rows, one per order line that passed every rule) is the fact. Branch (4 rows) filters Sales, Files (192 rows, one per branch workbook) and Set Aside (253 rows, key file plus excel_row) on branch, one to many. Date (1,461 days) filters Sales on order_date, one to many. Files and Set Aside have no date relationship.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .layer { font-size: 14px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 12px; fill: #94A3B8; }
    .name { font-size: 13px; fill: #F1F5F9; }
    .count { font-size: 11.5px; fill: #94A3B8; }
    .note { font-size: 12px; fill: #CBD5E1; }
    .col { font-size: 12.5px; fill: #E2E8F0; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect width="1000" height="696" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">The Power BI model</text>
  <text x="40" y="74" class="sub">Five tables from the three CSV files. One Branch slicer filters sales, files and set-aside rows together.</text>
