<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 506" width="1000" height="506" role="img" aria-label="Data flow through the six layers, left to right. Input files: 192 branch workbooks (4 branches, 48 months each) and the spelling map value_map.csv. Bronze layer, read_branch_file(): 10,089 order lines as received; 48 totals rows skipped. Silver layer, clean(): the same 10,089 rows in one standard. Gold layer, check(): five rules and duplicates; clean_sales.csv holds the 9,836 rows that pass, set_aside_rows.csv holds the 253 rows set aside (157 broke a rule, 96 pasted twice) with their values as received and the reason. Semantic layer, the Power BI model: Sales fact (9,836 rows), Date (1,461 days), Branch (4 rows), plus the Set Aside and Files tables for data quality. Analytical layer: 14 DAX measures over the model, and the Summary and Weekly sales tables pandas sums straight from clean_sales.csv. Reporting layer: weekly_report.xlsx and the Power BI Weekly report and Data quality pages. file_log.csv (192 rows, one per workbook) is the run log, not a layer.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .layer { font-size: 12.5px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 11.5px; fill: #506078; }
    .name { font-size: 12.5px; fill: #0F172A; }
    .count { font-size: 11.5px; fill: #506078; }
    .col { font-size: 12.5px; fill: #1E293B; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect x="1" y="1" width="998" height="504" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="50" class="title">Data flow, layer by layer</text>
  <text x="40" y="74" class="sub">Every file run.py reads and writes, the rows in each layer, and what Power BI builds on top. One command: python run.py.</text>
  <rect x="16" y="96" width="106" height="26" rx="13" fill="#94A3B8"/><text x="69.0" y="113.5" class="layer" text-anchor="middle">Input files</text>
  <text x="69.0" y="138" class="where" text-anchor="middle">data/input</text>
  <rect x="138" y="96" width="114" height="26" rx="13" fill="#3B82F6"/><text x="195.0" y="113.5" class="layer" text-anchor="middle">Bronze layer</text>
  <text x="195.0" y="138" class="where" text-anchor="middle">read_branch_file()</text>
  <rect x="268" y="96" width="112" height="26" rx="13" fill="#0EA5E9"/><text x="324.0" y="113.5" class="layer" text-anchor="middle">Silver layer</text>
  <text x="324.0" y="138" class="where" text-anchor="middle">clean()</text>
  <rect x="396" y="96" width="136" height="26" rx="13" fill="#F59E0B"/><text x="464.0" y="113.5" class="layer" text-anchor="middle">Gold layer</text>
  <text x="464.0" y="138" class="where" text-anchor="middle">check()</text>
  <rect x="572" y="96" width="120" height="26" rx="13" fill="#14B8A6"/><text x="632.0" y="113.5" class="layer" text-anchor="middle">Semantic layer</text>
  <text x="632.0" y="138" class="where" text-anchor="middle">Power BI model</text>
  <rect x="710" y="96" width="124" height="26" rx="13" fill="#A855F7"/><text x="772.0" y="113.5" class="layer" text-anchor="middle">Analytical layer</text>
  <text x="772.0" y="138" class="where" text-anchor="middle">pandas, DAX</text>
  <rect x="852" y="96" width="132" height="26" rx="13" fill="#22C55E"/><text x="918.0" y="113.5" class="layer" text-anchor="middle">Reporting layer</text>
  <text x="918.0" y="138" class="where" text-anchor="middle">Excel, Power BI</text>
  <rect x="16" y="150" width="106" height="92" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="25" y="167" class="name">192 branch</text><text x="25" y="183" class="count">workbooks</text>
  <text x="25" y="202" class="count">sheet Sales,</text>
  <text x="25" y="217" class="count">4 branches,</text>
  <text x="25" y="232" class="count">48 months each</text>
  <rect x="16" y="254" width="106" height="40" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="25" y="271" class="name">value_map.csv</text><text x="25" y="287" class="count">spelling map</text>
  <rect x="138" y="150" width="114" height="40" rx="7" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.4"/><text x="147" y="167" class="name">order lines</text><text x="147" y="183" class="count">10,089 rows, as sent</text>
  <rect x="138" y="202" width="114" height="40" rx="7" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="4 4"/><text x="147" y="219" class="name">totals rows</text><text x="147" y="235" class="count">48 skipped</text>
  <path d="M122 170.0 H138" class="edge" marker-end="url(#arrow)"/>
  <path d="M122 222.0 H138" class="edge" marker-end="url(#arrow)"/>
  <rect x="268" y="150" width="112" height="92" rx="7" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.4"/><text x="277" y="167" class="name">one standard</text><text x="277" y="183" class="count">10,089 rows</text>
  <text x="277" y="202" class="count">headers, dates,</text>
  <text x="277" y="219" class="count">amounts, units,</text>
  <text x="277" y="236" class="count">spellings</text>
  <path d="M252 170.0 H268" class="edge" marker-end="url(#arrow)"/>
  <path d="M122 274.0 H324.0 V242" class="edge" marker-end="url(#arrow)"/>
  <rect x="396" y="150" width="136" height="40" rx="7" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.4"/><text x="405" y="167" class="name">clean_sales.csv</text><text x="405" y="183" class="count">9,836 rows passed</text>
  <rect x="396" y="202" width="136" height="92" rx="7" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.4"/><text x="405" y="219" class="name">set_aside_rows.csv</text><text x="405" y="235" class="count">253 rows + reason</text>
  <text x="405" y="254" class="count">157 broke a rule,</text>
  <text x="405" y="271" class="count">96 pasted twice;</text>
  <text x="405" y="288" class="count">values as received</text>
  <path d="M380 170.0 H396" class="edge" marker-end="url(#arrow)"/>
  <path d="M380 222.0 H396" class="edge" marker-end="url(#arrow)"/>
  <rect x="572" y="202" width="120" height="40" rx="7" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.4"/><text x="581" y="219" class="name">Sales (fact)</text><text x="581" y="235" class="count">9,836 rows</text>
  <rect x="572" y="254" width="120" height="40" rx="7" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.4"/><text x="581" y="271" class="name">Date</text><text x="581" y="287" class="count">1,461 days</text>
  <rect x="572" y="306" width="120" height="40" rx="7" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.4"/><text x="581" y="323" class="name">Branch</text><text x="581" y="339" class="count">4 rows, from Files</text>
  <rect x="572" y="358" width="120" height="40" rx="7" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.4" stroke-dasharray="4 4"/><text x="581" y="375" class="name">Set Aside, Files</text><text x="581" y="391" class="count">data-quality tables</text>
  <text x="632" y="178.0" class="count" text-anchor="middle">no model: pandas</text>
  <text x="632" y="192.0" class="count" text-anchor="middle">sums the CSV</text>
  <path d="M532 161.0 H710" class="edge" marker-end="url(#arrow)"/>
  <path d="M532 170.0 C552.0 170.0 552.0 222.0 572 222.0" class="edge" marker-end="url(#arrow)"/>
  <path d="M532 179.0 C552.0 179.0 552.0 274.0 572 274.0" class="edge" marker-end="url(#arrow)"/>
  <path d="M532 248.0 C552.0 248.0 552.0 373.5 572 373.5" class="edge" marker-end="url(#arrow)"/>
  <rect x="16" y="414" width="516" height="30" rx="7" fill="#64748B"/><text x="28" y="434" class="name" style="fill:#FFFFFF">file_log.csv: 192 rows, one per workbook: the run log, not a layer</text>
  <path d="M532 429 C552.0 429 552.0 382.5 572 382.5" class="edge" marker-end="url(#arrow)"/>
  <rect x="710" y="150" width="124" height="40" rx="7" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.4"/><text x="719" y="167" class="name">Summary,</text><text x="719" y="183" class="count">Weekly sales</text>
  <rect x="710" y="202" width="124" height="196" rx="7" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.4"/><text x="719" y="219" class="name">14 DAX measures</text><text x="719" y="235" class="count">over the model</text>
  <text x="719" y="254" class="count">sales, profit,</text>
  <text x="719" y="271" class="count">margin, orders,</text>
  <text x="719" y="288" class="count">error rate</text>
  <path d="M693 202 H698 V398 H693" class="edge" stroke="#14B8A6"/>
  <path d="M698 300.0 H710" class="edge" marker-end="url(#arrow)"/>
  <rect x="852" y="150" width="132" height="40" rx="7" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.4"/><text x="861" y="167" class="name">weekly_report.xlsx</text><text x="861" y="183" class="count">4 sheets</text>
  <rect x="852" y="202" width="132" height="196" rx="10" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.4"/><text x="861" y="222" class="name" font-weight="700">Power BI</text>
  <rect x="862" y="270.0" width="112" height="26" rx="13" fill="#166534"/><text x="918.0" y="287.5" class="name" text-anchor="middle" style="fill:#FFFFFF">Weekly report</text>
  <rect x="862" y="306.0" width="112" height="26" rx="13" fill="#166534"/><text x="918.0" y="323.5" class="name" text-anchor="middle" style="fill:#FFFFFF">Data quality</text>
  <path d="M834 170.0 H852" class="edge" marker-end="url(#arrow)"/>
  <path d="M834 300.0 H852" class="edge" marker-end="url(#arrow)"/>
  <text x="40" y="476" class="where">Rows read = clean + set aside: 10,089 = 9,836 + 253. Totals rows are layout, not orders, and are only counted in file_log.csv.</text>
  <text x="40" y="493" class="where">The Excel report sums clean_sales.csv in pandas (no model step), and its Set aside and Clean data sheets copy the Gold layer files.</text>
</svg>
